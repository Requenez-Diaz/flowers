<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti 💛</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="petals"></div>

  <main class="scene">
    <div class="flower flower-1">
      <div class="stem"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
      <div class="head">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="core"></div>
      </div>
    </div>

    <div class="flower flower-2">
      <div class="stem"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
      <div class="head">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="core"></div>
      </div>
    </div>

    <div class="flower flower-3">
      <div class="stem"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
      <div class="head">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="core"></div>
      </div>
    </div>

    <div class="card" id="card">
      <div class="card-front">
        <span class="heart">💛</span>
        <p class="card-hint">Haz clic para abrir</p>
      </div>
      <div class="card-inside">
        <h1 class="title">Para tí</h1>
        <p class="message">
          "Detrás de cada flor amarilla hay un rayo de sol,
          y detrás de cada día difícil hay una razón para sonreír: <strong>tú</strong>."
        </p>
        <p class="message">
          Cada vez que veas un girasol, recuerda que siempre hay algo
          bonito que agradecer. Tu luz ilumina a todos los que te rodean.
        </p>
        <p class="signature">Con muchísimo cariño 💛</p>
      </div>
    </div>
  </main>

  <script src="item.js"></script>
</body>
</html>
